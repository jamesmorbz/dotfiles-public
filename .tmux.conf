# ~/.tmux.conf — lives in ~/dev/dotfiles, symlinked by setup.sh
# Private overrides go in ~/.tmux.conf.local (not in git)

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"
# Extended keys: Shift+Enter, Ctrl+Shift combos etc. reach programs inside tmux (Claude Code newline)
set -s extended-keys on
if-shell "tmux show -s extended-keys-format" "set -s extended-keys-format csi-u"   # tmux 3.5+
set -as terminal-features ",xterm-ghostty:extkeys"

# Window pills show the folder name; Ghostty's title shows session · window (AltTab tells them apart)
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
set -g set-titles on
set -g set-titles-string "#S · #W"
# Closing a session's last window switches to another session instead of leaving tmux
set -g detach-on-destroy off

# A bell in a background window (e.g. Claude finished or waiting, via claude/tmux-state.sh) flags its pill
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# New windows and splits open in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Panes: h/j/k/l to move, H/J/K/L to resize (repeatable). Ghostty maps ⌘⌥ arrows to prefix + arrow.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Popups: g lazygit, f jump to any session/window, t scratch shell, ? cheatsheet
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind f display-popup -E -w 60% -h 50% "zsh ~/dev/dotfiles/tmux/pick.sh"
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"
bind ? display-popup -E -w 70% -h 90% "bat --plain --language=md --paging=always ~/dev/dotfiles/tmux/cheatsheet.md 2>/dev/null || less ~/dev/dotfiles/tmux/cheatsheet.md"

# Copy: vi keys in copy mode; mouse drags and y copy to the macOS clipboard
setw -g mode-keys vi
# macOS: pbcopy. Linux desktop: wl-copy/xclip. Over SSH, set-clipboard (OSC 52) reaches your local clipboard.
if-shell "command -v pbcopy" "set -s copy-command pbcopy" \
  'if-shell "command -v wl-copy" "set -s copy-command wl-copy" "if-shell \"command -v xclip\" \"set -s copy-command \\\"xclip -selection clipboard\\\"\""'
set -s set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Theme: Catppuccin Mocha with rounded "pill" segments (Nerd Font glyphs; Ghostty has them built in).
# setup.sh clones the plugin (pinned) into ~/.config/tmux/plugins/catppuccin/tmux.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Claude traffic light + name, set per window by claude/tmux-state.sh (hooks): red busy, yellow waiting, green free.
# Name is "folder: task" while Claude runs, otherwise the window name (folder).
set -g @claude_light "#{?#{==:#{@claude_state},busy},#[fg=#{@thm_red}]● ,#{?#{==:#{@claude_state},waiting},#[fg=#{@thm_yellow}]● ,#{?#{==:#{@claude_state},free},#[fg=#{@thm_green}]● ,}}}#[fg=#{@thm_fg}]"
set -g @claude_name "#{?@claude_task,#{@claude_dir}: #{@claude_task},#W}"
set -g @catppuccin_window_text " #{E:@claude_light}#{E:@claude_name}"
set -g @catppuccin_window_current_text " #{E:@claude_light}#{E:@claude_name}"
set -g @catppuccin_window_flags "icon"           # bell / zoom / activity icons on the pills
set -g @catppuccin_date_time_text " %H:%M"
if-shell "test -f ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux" \
  "run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux"

set -g status-position bottom
# While ⌘B waits for a key: red pill + hint strip (⌘B ? = full cheatsheet). Yellow pill in copy mode.
set -g status-left "#{?client_prefix,#[fg=#{@thm_red}]#[bg=#{@thm_red}#,fg=#{@thm_crust}#,bold] ⌘B #[fg=#{@thm_red}#,bg=default#,nobold]#[fg=#{@thm_subtext_0}] c new · | - split · z zoom · g git · f find · t shell · d detach · #[fg=#{@thm_yellow}#,bold]? all keys#[default]  ,#{?pane_in_mode,#[fg=#{@thm_yellow}]#[bg=#{@thm_yellow}#,fg=#{@thm_crust}#,bold] COPY #[fg=#{@thm_yellow}#,bg=default#,nobold] ,}}"
set -g status-left-length 150
set -g status-right-length 200
# Claude pills (model, context %, cost, folder + branch) for the current window, written by claude/statusline.sh
set -g @claude_pills "#[fg=#{@thm_mauve}]#[fg=#{@thm_crust},bg=#{@thm_mauve}]󰚩 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{@claude_model}#[fg=#{@thm_surface_0},bg=default] #[fg=#{@claude_ctx_fg}]#[fg=#{@thm_crust},bg=#{@claude_ctx_fg}]󰍛 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{@claude_ctx}#[fg=#{@thm_surface_0},bg=default] #[fg=#{@thm_yellow}]#[fg=#{@thm_crust},bg=#{@thm_yellow}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{@claude_cost}#[fg=#{@thm_surface_0},bg=default] #[fg=#{@thm_blue}]#[fg=#{@thm_crust},bg=#{@thm_blue}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{@claude_where}#[fg=#{@thm_surface_0},bg=default] "
set -g status-right "#{?@claude_model,#{E:@claude_pills},}#{E:@catppuccin_status_session}#{E:@catppuccin_status_date_time}"

# Sessions survive restarts: resurrect saves windows/panes/folders, continuum saves every 15 min and
# restores when tmux starts. Pinned clones (setup.sh). Must load after status-right is set.
set -g @resurrect-dir "~/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"
if-shell "test -d ~/.config/tmux/plugins/tmux-resurrect" "run ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux"
if-shell "test -d ~/.config/tmux/plugins/tmux-continuum" "run ~/.config/tmux/plugins/tmux-continuum/continuum.tmux"

if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
